  font: 600 .62em/1.45em var(--font-ui); text-align: center; vertical-align: .3em; margin-inline-end: .3em; }

  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px));

<script>
const DATA = __DATA__;
window.RS_VERSION = window.RS_VERSION || '__VERSION__';
const $ = s => document.querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },

};
let marks = new Set(store.get('rs-marks', []));
let view = store.get('rs-view', 'both');
let scale = store.get('rs-scale', 1);
let onlyMarks = false;

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const babs = [];
DATA.hadith.forEach(h => {
  let b = babs[babs.length - 1];
  if (!b || b.title !== h.bab) { b = { title: h.bab, items: [] }; babs.push(b); }
  b.items.push(h);
});
babs.forEach((b, i) => { const m = b.title.match(/^(\d+)\.\s*(.*)$/); b.n = m ? m[1] : String(i + 1); b.name = (m ? m[2] : b.title).replace(/^Bab\s+/i, ''); b.id = 'bab-' + b.n; });
(DATA.bab_kosong || []).forEach(e => { const m = e.bab.match(/^(\d+)\.\s*(.*)$/); babs.push({ title: e.bab, items: [], n: m[1], name: m[2].replace(/^Bab\s+/i, ''), id: 'bab-' + m[1], nota: e.nota, raw: e }); });
babs.sort((a, b) => a.n - b.n);

const NOTICE = '<strong>Draf terjemahan, belum disemak.</strong> Terjemahan Melayu dibuat oleh AI daripada teks Arab dan perlu disemak oleh ahli ilmu sebelum dijadikan rujukan. ' +
  'Baris (harakat) pada teks Arab juga ditambah oleh AI dan perlu disemak. Nombor hadis mengikut susunan sunnah.com. Sudah siap: <strong>' + DATA.hadith.length + ' daripada ' + DATA.total + '</strong> hadis.<br><strong>Nota peribadi:</strong> pilih (tekan lama) mana-mana teks, dan menu akan muncul untuk menyerlah, menggaris, meletak nombor, menulis nota atau pindaan. Semua nota anda terkumpul di ikon buku nota. Teks asal tidak berubah, dan nota anda tidak dilihat oleh orang lain.' +
  '<div class="legend"><span><span class="nb-q">Tulisan tebal berwarna</span> = sabda Nabi ﷺ</span><span><span class="nb-f">Latar berwarna</span> = perbuatan Nabi ﷺ</span></div>';

function srcLabel(t) {
  if (/^Muttafaq/.test(t)) return 'Muttafaq ʿalaih';
  const m = t.match(/^Riwayat ([^,.]+?)(?:[,.]|$)/);
  return m ? 'Riwayat ' + m[1] : '';
}
let ANN = new Map();      // shared teacher notes
let MINE_DB = new Map();  // personal notes kept in the artifact store
let MINE_LOCAL = new Map(); // personal notes kept in this browser
let uid = null, personalMode = 'local';
const LKEY = 'rs-nota-saya';
function loadLocal() { MINE_LOCAL = new Map(); (store.get(LKEY, []) || []).forEach(a => { if (!MINE_LOCAL.has(a.no)) MINE_LOCAL.set(a.no, []); MINE_LOCAL.get(a.no).push(Object.assign({}, a, { scope: 'saya', local: true })); }); }
function saveLocal() { const all = []; MINE_LOCAL.forEach(l => l.forEach(a => { const c = Object.assign({}, a); delete c.local; delete c.scope; all.push(c); })); store.set(LKEY, all); }
loadLocal();
let annOn = store.get('rs-ann', true);
let altInline = store.get('rs-alt', false);
let db = null, canWrite = false, annReady = false;
const HMAP = new Map(DATA.hadith.map(h => [h.no, h]));
const KIND = { serlah: 'Serlahan', garis: 'Garis bawah', nombor: 'Nombor', nota: 'Nota', pindaan: 'Pindaan terjemahan', umum: 'Nota umum' };
const LETTERS = 'abcdefghijklmnopqrstuvwxyz';
const lblOf = (a, i) => String(i + 1);

function findOcc(text, quote, occ) { let i = -1; for (let k = 0; k <= occ; k++) { i = text.indexOf(quote, i + 1); if (i < 0) return -1; } return i; }
function sortNumber(list, h) {
  const fo = { ar: 0, ms: 1 };
  list.forEach(a => { a.pos = a.field ? findOcc(h[a.field] || '', a.quote || '', a.occ || 0) : -1; });
  list.sort((a, b) => {
    const ka = a.field ? (a.pos < 0 ? 2 : fo[a.field]) : 3, kb = b.field ? (b.pos < 0 ? 2 : fo[b.field]) : 3;
    return ka - kb || (a.pos - b.pos) || ((a.at || 0) - (b.at || 0));
  });
  list.forEach((a, i) => { a.n = lblOf(a, i); });
  return list;
}
function prepAnns(h) {
  const g = sortNumber((ANN.get(h.no) || []).map(a => Object.assign({}, a, { scope: 'guru' })), h);
  const s = sortNumber([...(MINE_DB.get(h.no) || []), ...(MINE_LOCAL.get(h.no) || [])].map(a => Object.assign({}, a, { scope: 'saya' })), h);
  h._g = g; h._s = s; h._anns = g.concat(s);
  return h._anns;
}
function overlaps(r, list) { return list.some(x => r.s < x.e && x.s < r.e); }
let nabOn = store.get('rs-nab', true);
function annRanges(text, h, field) {
  const R = [];
  for (const a of (h._anns || [])) {
    if (a.field !== field || a.pos < 0) continue;
    const r = { s: a.pos, e: a.pos + a.quote.length, a };
    if (!overlaps(r, R)) R.push(r);
  }
  return R.sort((x, y) => x.s - y.s);
}
/* Render text[from,to) with three layers: personal notes (outer <mark>), Prophetic words/actions (<span>), search hits (<mark>). */
function layered(text, from, to, anns, nab, q) {
  const S = [];
  if (q) { const lt = text.toLowerCase(), lq = q.toLowerCase(); let i = lt.indexOf(lq, from); while (i >= 0 && i < to) { S.push([i, Math.min(i + lq.length, to)]); i = lt.indexOf(lq, i + lq.length); } }
  const cuts = new Set([from, to]);
  const add = (s, e) => { if (e > from && s < to) { cuts.add(Math.max(s, from)); cuts.add(Math.min(e, to)); } };
  anns.forEach(r => add(r.s, r.e)); nab.forEach(r => add(r[0], r[1])); S.forEach(r => add(r[0], r[1]));
  const pts = [...cuts].sort((x, y) => x - y);
  const inR = (x, list, f) => list.find(r => f(r)[0] <= x && x < f(r)[1]);
  let out = '', cur = null;

$('#list').addEventListener('click', e => {
  const mk = e.target.closest('[data-mark]');
  if (mk) {
    const n = +mk.dataset.mark;
    marks.has(n) ? marks.delete(n) : marks.add(n);
    store.set('rs-marks', [...marks]);
    const on = marks.has(n);
    mk.setAttribute('aria-pressed', on); mk.firstChild.textContent = on ? '★' : '☆';
    toast(on ? 'Hadis ' + n + ' ditanda' : 'Tanda dibuang');
    if (onlyMarks) render();
    return;
  }
  const sh = e.target.closest('[data-share]');
  if (sh) { openShare(+sh.dataset.share); return; }
  const cp = e.target.closest('[data-copy]');
  if (cp) {
    const h = DATA.hadith.find(x => x.no === +cp.dataset.copy);
    const text = 'Riyadhus Salihin, Hadis ' + h.no + '\n\n' + h.ar + '\n\n' + h.ms + '\n\n(' + h.takhrij + ')';
    const ok = () => toast('Hadis ' + h.no + ' disalin');
    try {
      navigator.clipboard.writeText(text).then(ok, () => fallbackCopy(text, ok));
    } catch (err) { fallbackCopy(text, ok); }
  }
});
function fallbackCopy(text, ok) {
  const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); ok(); } catch (e) { toast('Tidak dapat menyalin. Pilih teks secara manual.'); }
  ta.remove();
}

/* ---------- Teacher annotations: popover, selection bar, editor, storage ---------- */
function findAnn(id) {
  for (const [m, scope] of [[ANN, 'guru'], [MINE_DB, 'saya'], [MINE_LOCAL, 'saya']]) for (const list of m.values()) { const a = list.find(x => x.id === id); if (a) return Object.assign({}, a, { scope }); }
  return null;
}
function numbered(id) { const a = findAnn(id); if (!a) return null; const h = HMAP.get(a.no); return (prepAnns(h).find(x => x.id === id)) || null; }
const pop = $('#pop');
function closePop() { pop.hidden = true; pop.innerHTML = ''; }
function openPop(el, id) {
  const a = numbered(id); if (!a) return;
  let html = '<div class="row"><span class="ann-n"' + (a.scope === 'saya' ? ' style="background:var(--jade)"' : '') + '>' + esc(a.n) + '</span><span class="ann-kind">' + (a.scope === 'saya' ? 'Nota saya · ' : '') + esc(KIND[a.type] || 'Nota') + '</span><button type="button" class="x" data-close aria-label="Tutup">×</button></div>';
  if (a.type === 'pindaan') {
    html += '<div><span class="ann-kind">Terjemahan asal</span><div class="ann-quote">“' + esc(a.quote) + '”</div></div>';
    if (a.alt) html += '<div><span class="ann-kind">Pindaan anda</span><div class="ann-alt">' + esc(a.alt) + '</div></div>';
  } else if (a.field) {
    html += '<div class="ann-quote" lang="' + (a.field === 'ar' ? 'ar' : 'ms') + '"' + (a.field === 'ar' ? ' dir="rtl"' : '') + '>“' + esc(a.quote) + '”</div>';
  }
  if (a.text) html += '<div class="ann-text">' + esc(a.text) + '</div>';
  if (mayEdit(a)) html += '<div class="ann-tools"><button type="button" data-edit="' + esc(a.id) + '">Sunting</button><button type="button" data-del="' + esc(a.id) + '">Padam</button></div>';
  pop.innerHTML = html; pop.hidden = false;
  const r = el.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
  let left = Math.min(Math.max(16, r.left + window.scrollX), window.scrollX + document.documentElement.clientWidth - pw - 16);
  let top = r.bottom + window.scrollY + 8;
  if (r.bottom + ph + 16 > window.innerHeight && r.top - ph - 8 > 0) top = r.top + window.scrollY - ph - 8;
  pop.style.left = left + 'px'; pop.style.top = top + 'px';
  const x = pop.querySelector('[data-close]'); if (x) x.focus({ preventScroll: true });
}
document.addEventListener('click', e => {
  const m = e.target.closest('mark.ann');
  if (m && !document.body.classList.contains('no-ann')) { e.preventDefault(); openPop(m, m.dataset.ann); return; }
  if (e.target.closest('[data-close]')) { closePop(); return; }

  const add = e.target.closest('[data-addnote]'); if (add) { openEditor({ no: +add.dataset.addnote, type: 'umum', field: null, scope: canWrite ? 'guru' : 'saya' }); return; }
  const li = e.target.closest('[data-li]');

/* Selection → teacher toolbar */
const selbar = $('#selbar');
let pending = null, selT;
function countIn(hay, needle) { let c = 0, i = hay.indexOf(needle); while (i >= 0) { c++; i = hay.indexOf(needle, i + needle.length); } return c; }
const HLC = [["y", "Kuning"], ["o", "Oren"], ["r", "Merah"], ["p", "Merah jambu"], ["u", "Ungu"], ["b", "Biru"], ["t", "Biru laut"], ["g", "Hijau"], ["l", "Hijau pucuk"], ["k", "Kelabu"]];
let hlLast = store.get('rs-hl', 'y'), selView = 'main';
const SVG_NUM = '<span class="numdot">1</span>';
function drawSelbar(hint) {
  if (!pending && !hint) { selbar.hidden = true; document.body.classList.remove('selon'); return; }
  const q = pending ? '“' + esc(pending.quote) + '”' : esc(hint);
  let tools = '', top = '<button type="button" class="x" data-sel="cancel" aria-label="Tutup">×</button>';
  if (pending && selView === 'warna') {
    top = '<button type="button" data-sel="back">‹ Kembali</button>';
    tools = '<span class="grp pal" role="group" aria-label="Pilih warna serlahan">' + HLC.map(([k, n]) => '<button type="button" class="tool dot" data-sel="hl" data-c="' + k + '" title="' + n + '" aria-label="' + n + '" aria-pressed="' + (k === hlLast) + '" style="background:var(--hl-' + k + ')"></button>').join('') + '</span>';
  } else if (pending) {
    tools = '<span class="grp"><button type="button" class="tool hlbtn" data-sel="warna" title="Serlah" aria-label="Serlah — pilih warna"><span class="sw-dot" style="background:var(--hl-' + hlLast + ')"></span>Serlah ▾</button>' +
      '<button type="button" class="tool ul" data-sel="garis">Garis</button>' +
      '<button type="button" class="tool" data-sel="nombor" title="Letak nombor">' + SVG_NUM + ' Nombor</button>' +
      '<button type="button" class="tool" data-sel="nota">Nota</button>' +
      (pending.field === 'ms' ? '<button type="button" class="tool" data-sel="pindaan">Pindaan</button>' : '') + '</span>';
  }
  selbar.innerHTML = '<div class="srow"><span class="q" dir="auto">' + q + '</span>' + top + '</div>' + (tools ? '<div class="trow">' + tools + '</div>' : '');
  selbar.hidden = false; document.body.classList.add('selon');
}
function hideSelbar() { pending = null; selView = 'main'; drawSelbar(); }
function readSelection() {
  if (!$('#modalBg').hidden) return;
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount || sel.isCollapsed) { hideSelbar(); return; }
  const r = sel.getRangeAt(0);
  const node = r.commonAncestorContainer.nodeType === 1 ? r.commonAncestorContainer : r.commonAncestorContainer.parentElement;
  const box = node && node.closest('.ms-text, .ar-text');
  const art = box && box.closest('.hadith');
  if (!art) { hideSelbar(); return; }
  const h = HMAP.get(+art.dataset.no);
  const field = box.classList.contains('ar-text') ? 'ar' : 'ms';
  const quote = sel.toString().replace(/[﴿﴾]/g, '').replace(/\s+/g, ' ').trim();
  pending = null; selView = 'main';
  if (!quote) { drawSelbar(); return; }
  if (field === 'ar' && !barisOn) { drawSelbar('Hidupkan baris (ikon mata) untuk menanda teks Arab.'); return; }
  if (!h[field].includes(quote)) { drawSelbar('Pilih teks dalam satu perenggan sahaja, tanpa melintasi tanda lain.'); return; }
  const pre = document.createRange(); pre.setStart(box, 0); pre.setEnd(r.startContainer, r.startOffset);
  const occ = Math.min(countIn(pre.toString().replace(/[﴿﴾]/g, ''), quote), countIn(h[field], quote) - 1);
  pending = { no: h.no, field, quote, occ: Math.max(0, occ) };
  drawSelbar();
}
function nextNum(no) {
  const nums = myNotes().filter(a => a.no === no && a.type === 'nombor').map(a => parseInt(a.num, 10)).filter(n => !isNaN(n));
  return String(nums.length ? Math.max(...nums) + 1 : 1);
}
document.addEventListener('selectionchange', () => { clearTimeout(selT); selT = setTimeout(readSelection, 250); });
selbar.addEventListener('mousedown', e => e.preventDefault());
selbar.addEventListener('click', e => {
  const b = e.target.closest('[data-sel]'); if (!b) return;
  const kind = b.dataset.sel, p = pending;
  if (kind === 'warna') { selView = 'warna'; drawSelbar(); return; }
  if (kind === 'back') { selView = 'main'; drawSelbar(); return; }
  if (kind === 'cancel' || !p) { try { window.getSelection().removeAllRanges(); } catch (err) {} hideSelbar(); return; }
  try { window.getSelection().removeAllRanges(); } catch (err) {}
  hideSelbar();
  if (kind === 'hl') { hlLast = b.dataset.c; store.set('rs-hl', hlLast); quickMark(p, 'serlah', hlLast); return; }
  if (kind === 'garis') { quickMark(p, 'garis', 'p'); return; }
  if (kind === 'nombor') { quickMark(p, 'nombor', '', nextNum(p.no)); return; }
  openEditor(Object.assign({}, p, { type: kind, color: '', alt: kind === 'pindaan' ? p.quote : '', scope: 'saya' }));
});

async function quickMark(p, type, color, num) {
  const h = HMAP.get(p.no), st = findOcc(h[p.field] || '', p.quote, p.occ || 0), en = st + p.quote.length;
  if ((h._anns || prepAnns(h)).some(x => x.field === p.field && x.pos >= 0 && st < x.pos + x.quote.length && x.pos < en)) { toast('Bahagian ini sudah ditanda. Ketik tanda itu untuk mengubahnya.'); return; }
  const id = newId(), body = { no: p.no, type, field: p.field, quote: p.quote, occ: p.occ || 0, text: '', alt: '', color: color || '', at: Date.now() };
  if (type === 'nombor') body.num = num || '1';
  try {
    const where = await savePersonal(id, body, false);
    if (where === 'local') render();
    toast(type === 'garis' ? 'Digaris.' : type === 'nombor' ? 'Nombor ' + body.num + ' ditambah. Ketik untuk menukar.' : 'Diserlah.');
  } catch (err) { writeFailed(err); }
}

/* Editor modal */
const modalBg = $('#modalBg'), modal = $('#modal');
let editing = null;
function closeModal() { modalBg.hidden = true; modal.innerHTML = ''; editing = null; }
function openEditor(a) {
  editing = a;
  const isNew = !a.id, type = a.type;
  let html = '<h2>' + (isNew ? 'Tambah ' : 'Sunting ') + esc((KIND[type] || 'Nota').toLowerCase()) + ' · Hadis ' + a.no + '</h2>';
  if (a.field) html += '<div class="quote" lang="' + (a.field === 'ar' ? 'ar' : 'ms') + '">' + esc(a.quote) + '</div>';
  if (isNew && canWrite) html += '<div class="scope" role="radiogroup" aria-label="Siapa boleh melihat"><label><input type="radio" name="scope" id="sc-guru" value="guru"' + (a.scope !== 'saya' ? ' checked' : '') + '> Untuk semua pelajar</label><label><input type="radio" name="scope" id="sc-saya" value="saya"' + (a.scope === 'saya' ? ' checked' : '') + '> Saya sahaja</label></div>';
  if (type === 'serlah' || type === 'garis') {
    html += '<label>Gaya<span class="scope" role="radiogroup"><label><input type="radio" name="style" value="serlah"' + (type === 'serlah' ? ' checked' : '') + '> Serlah</label><label><input type="radio" name="style" value="garis"' + (type === 'garis' ? ' checked' : '') + '> Garis bawah</label></span></label>';
    html += '<div id="colWrap">' + colorField(type, a.color) + '</div>';
  }
  if (type === 'nombor') html += '<label for="f-num">Nombor atau label (cth. 1, 2, a, i)<input id="f-num" name="num" maxlength="6" required value="' + esc(a.num || '') + '" style="border:1px solid var(--rule);border-radius:8px;padding:8px 10px;background:var(--paper)"></label>';
  if (type === 'pindaan') html += '<label for="f-alt">Terjemahan pilihan anda<textarea id="f-alt" name="alt" required>' + esc(a.alt || '') + '</textarea></label>';
  html += '<label for="f-text">' + ((type === 'serlah' || type === 'garis' || type === 'nombor') ? 'Nota (pilihan)' : type === 'pindaan' ? 'Sebab atau penjelasan (pilihan)' : 'Nota') + '<textarea id="f-text" name="text"' + ((type === 'nota' || type === 'umum') ? ' required' : '') + '>' + esc(a.text || '') + '</textarea></label>';
  html += '<div class="btns"><button type="button" data-m="cancel">Batal</button><button type="submit" class="pri">Simpan</button></div>';
  modal.innerHTML = html; modalBg.hidden = false;
  const f = modal.querySelector('#f-num') || modal.querySelector('textarea'); if (f) f.focus();
}
function colorField(type, cur) {
  const list = type === 'garis' ? [['p', 'Warna garis utama', '--ul-p'], ['y', 'Emas', '--ul-y'], ['g', 'Hijau', '--ul-g']] : HLC.map(([k, n]) => [k, n, '--hl-' + k]);
  if (!list.some(x => x[0] === cur)) cur = list[0][0];
  return '<label>Warna<span class="swatches" style="flex-wrap:wrap">' + list.map(([c, n, v]) =>
    '<label title="' + n + '"><input type="radio" name="color" value="' + c + '"' + (cur === c ? ' checked' : '') + '><span style="background:var(' + v + ')"></span><span hidden>' + n + '</span></label>').join('') + '</span></label>';
}
modal.addEventListener('change', e => { if (e.target.name === 'style' && $('#colWrap')) $('#colWrap').innerHTML = colorField(e.target.value, editing && editing.color); });
function openDelete(a) {
  editing = a;
  modal.innerHTML = '<h2>Padam ' + esc((KIND[a.type] || 'nota').toLowerCase()) + '?</h2><p style="margin:0;color:var(--ink-soft)">Ia akan dibuang daripada nota anda. Teks hadis tidak berubah.</p>' +
    (a.field ? '<div class="quote" lang="' + (a.field === 'ar' ? 'ar' : 'ms') + '">' + esc(a.quote) + '</div>' : '') +
    '<div class="btns"><button type="button" data-m="cancel">Batal</button><button type="button" class="pri" data-m="del" style="background:#b3261e;border-color:#b3261e">Padam</button></div>';
  modalBg.hidden = false;
}
modalBg.addEventListener('click', e => { if (e.target.closest('[data-m="imp"]')) { doImport(); return; } if (e.target === modalBg || e.target.closest('[data-m="cancel"]')) closeModal(); else if (e.target.closest('[data-m="del"]')) doDelete(); });
function newId() { return 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function putLocal(id, body) {
  MINE_LOCAL.forEach(l => { const i = l.findIndex(x => x.id === id); if (i >= 0) l.splice(i, 1); });
  if (body) { if (!MINE_LOCAL.has(body.no)) MINE_LOCAL.set(body.no, []); MINE_LOCAL.get(body.no).push(Object.assign({ id }, body, { local: true })); }
  saveLocal();
}
async function savePersonal(id, body, wasLocal) {
  if (personalMode === 'db' && db && uid && !wasLocal) {
    try { await db.collection('data/users/' + uid).doc(id).set(body); return 'db'; }
    catch (err) { if (!(err && (err.code === 'invalid_argument' || err.code === 'not_granted'))) throw err; personalMode = 'local'; }
  }
  putLocal(id, body); return 'local';
}
modal.addEventListener('submit', async e => {
  e.preventDefault(); if (!editing || editing.importing || editing.sharing) return;
  const fd = new FormData(modal);
  const text = String(fd.get('text') || '').trim(), alt = String(fd.get('alt') || '').trim();
  if ((editing.type === 'nota' || editing.type === 'umum') && !text) { toast('Tulis nota dahulu.'); return; }
  if (editing.type === 'pindaan' && !alt) { toast('Tulis cadangan terjemahan dahulu.'); return; }
  const scope = editing.id ? editing.scope : (canWrite ? String(fd.get('scope') || 'guru') : 'saya');
  const mk = editing.type === 'serlah' || editing.type === 'garis';
  const type = mk ? String(fd.get('style') || editing.type) : editing.type;
  const num = String(fd.get('num') || '').trim().slice(0, 6);
  if (type === 'nombor' && !num) { toast('Tulis nombor dahulu.'); return; }
  const body = { no: editing.no, type, field: editing.field || null, quote: editing.quote || '', occ: editing.occ || 0,
    text, alt: editing.type === 'pindaan' ? alt : '', color: mk ? String(fd.get('color') || 'y') : '', at: editing.at || Date.now() };
  if (type === 'nombor') body.num = num;
  const btn = modal.querySelector('[type=submit]'); btn.disabled = true;
  try {
    if (scope === 'guru') {
      if (!db || !canWrite) throw { code: 'not_granted' };
      if (editing.id) await db.doc('anotasi/' + editing.id).set(body); else await db.collection('anotasi').add(body);
      closeModal(); toast('Disimpan. Semua pelajar akan melihatnya.');
    } else {
      const where = await savePersonal(editing.id || newId(), body, !!editing.local);
      closeModal(); render(); toast(where === 'db' ? 'Disimpan dalam nota anda.' : 'Disimpan dalam peranti ini.');
    }
  } catch (err) { btn.disabled = false; writeFailed(err); }
});
async function doDelete() {
  const a = editing; if (!a || !a.id) return;
  try {
    if (a.scope === 'guru') { if (!db) return; await db.doc('anotasi/' + a.id).delete(); }
    else if (a.local) { putLocal(a.id, null); render(); }
    else { await db.collection('data/users/' + uid).doc(a.id).delete(); }
    closeModal(); toast('Dipadam.');
  } catch (err) { writeFailed(err); }
}
function writeFailed(err) {
  const code = err && err.code;
  if (code === 'invalid_argument' || code === 'not_granted') { canWrite = false; document.body.classList.remove('teacher'); closeModal(); toast('Nota tidak dapat disimpan dalam akaun ini. Cuba muat semula halaman.'); render(); }
  else if (code === 'quota_exceeded') toast('Ruang simpanan nota sudah penuh. Padam beberapa nota lama.');
  else toast('Tidak dapat menyimpan. Cuba lagi sebentar.');
}

function myNotes() {
  const out = [];
  for (const m of [MINE_DB, MINE_LOCAL]) for (const [no, l] of m) { const h = HMAP.get(no); if (!h) continue; l.forEach(a => out.push(Object.assign({ pos: a.field ? findOcc(h[a.field] || '', a.quote || '', a.occ || 0) : 1e9 }, a))); }
  return out.sort((a, b) => a.no - b.no || (a.field === b.field ? 0 : a.field === 'ar' ? -1 : 1) || a.pos - b.pos);
}
function currentNo() {
  const top = $('.bar').getBoundingClientRect().bottom + 8;
  for (const el of document.querySelectorAll('.hadith')) if (el.getBoundingClientRect().bottom > top) return +el.dataset.no;
  return DATA.hadith[0].no;
}
function notesHtml() {
  const list = myNotes(), cur = currentNo();
  const sw = a => a.type === 'serlah' ? '<span class="chip" style="background:var(--hl-' + esc(a.color || 'y') + ')"></span>' : a.type === 'garis' ? '<span class="chip" style="background:var(--ul-' + esc(a.color || 'p') + ')"></span>' : a.type === 'nombor' ? '<span class="chip" style="background:var(--jade);color:var(--sheet);width:auto;height:auto;padding:0 5px;border-radius:7px;font-size:10px;vertical-align:0">' + esc(a.num || '') + '</span>' : '';
  return '<button type="button" class="addn" data-addnote="' + cur + '">＋ Tambah nota pada Hadis ' + cur + '</button>' +
    '<div class="prow"><span class="plbl">Nota saya · ' + list.length + '</span>' +
    (list.length ? '<ol class="nlist">' + list.map(a => '<li><button type="button" data-goto="' + esc(a.id) + '" data-no="' + a.no + '"><span class="meta">' + sw(a) + 'Hadis ' + a.no + ' · ' + esc(KIND[a.type] || 'Nota') + '</span>' +
      (a.quote ? '<span class="qt"' + (a.field === 'ar' ? ' lang="ar" dir="rtl"' : '') + '>' + esc(a.quote) + '</span>' : '') +
      (a.type === 'pindaan' && a.alt ? '<span class="tx">→ ' + esc(a.alt) + '</span>' : '') + (a.text ? '<span class="tx">' + esc(a.text) + '</span>' : '') + '</button></li>').join('') + '</ol>'
      : '<p style="margin:0;color:var(--ink-soft)">Belum ada nota. Tekan ikon pen dan pilih teks untuk mula menanda.</p>') + '</div>';
}
function updateToggles() {

  b.hidden = !n; b.textContent = n > 99 ? '99+' : n;
  if (!$('#pNotes').hidden) $('#pNotes').innerHTML = notesHtml();

/* Image card drawn on a canvas */
function wrapLines(ctx, text, width) {
  const out = [];
  text.split('\n').forEach(para => {
    if (!para.trim()) { out.push(''); return; }
    let line = '';
    para.split(/\s+/).forEach(w => {
      const t = line ? line + ' ' + w : w;
      if (ctx.measureText(t).width > width && line) { out.push(line); line = w; } else line = t;
    });
    if (line) out.push(line);
  });
  return out;
}

function exportNotes() {

  const name = 'nota-riyadhus-salihin-' + new Date().toISOString().slice(0, 10) + '.json';
  if (window.RSApp && RSApp.shareFile) { RSApp.shareFile(name, json); return; }

    window.claude.use('downloads').then(dl => {
      if (!dl) return blobSave(name, json, notes.length);

/* Connect to shared storage */
(async () => {
  if (!window.claude || !window.claude.use) return;
  let u = null;
  try { [u, db] = await Promise.all([window.claude.use('user'), window.claude.use('db')]); } catch (err) { db = null; }
  if (!db) return;
  canWrite = false; // personal notes only
  uid = u ? await u.id() : null;
  if (uid) {
    personalMode = 'db';
    db.collection('data/users/' + uid).onSnapshot(snap => {
      const next = new Map();
      snap.docs.forEach(d => { const a = Object.assign({ id: d.id }, d.data()); if (typeof a.no !== 'number') return; if (!next.has(a.no)) next.set(a.no, []); next.get(a.no).push(a); });
      MINE_DB = next; render();
    }, err => { console.warn('nota saya', err && err.code); });
  }
})();
