<meta charset="utf-8">
<title>Riyadhus Salihin Melayu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a single reading column like a printed kitab; bab index as a side rail on wide screens, a sheet on phones. */
:root {
  --paper: #f6f7f4;
  --sheet: #ffffff;
  --ink: #1d2422;
  --ink-soft: #56615d;
  --rule: #dfe4e0;
  --jade: #0e6b58;
  --jade-tint: #e3efe9;
  --gold: #8a6a1f;
  --mark: #fbf0c9;
  --matn: #8a3b12; --matn-tint: #f6e6da;
  --ul-y: #b8860b; --ul-g: #1f7a55; --ul-p: #c0392b;
  --hl-y: #fbe7a6; --hl-o: #fbd2ae; --hl-r: #f7c1bb; --hl-p: #f6d3dc; --hl-u: #e4d8f3; --hl-b: #cfe1f7; --hl-t: #c4e8ef; --hl-g: #cfe9d9; --hl-l: #e0efc2; --hl-k: #e3e3de; --shadow: 0 10px 30px rgb(20 30 25 / .18);
  --font-ar: "Amiri", "Scheherazade New", "Noto Naskh Arabic", "Traditional Arabic", serif;
  --font-body: "Gentium Book Plus", "Georgia", "Times New Roman", serif;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --scale: 1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-theme="sepia"]) {
    --paper: #121816; --sheet: #18201d; --ink: #e4ebe7; --ink-soft: #9aa8a2;
    --rule: #2a3531; --jade: #5fc0a6; --jade-tint: #1d3029; --gold: #d2b46a; --mark: #4a4120;
    --matn: #f0a479; --matn-tint: #3d2a1f; --ul-y: #e0b44a; --ul-g: #5fc596; --ul-p: #f07a6a; --hl-y: #5a4b1c; --hl-o: #5c3a1a; --hl-r: #5e2320; --hl-p: #5a2a37; --hl-u: #3e2d57; --hl-b: #1e3a57; --hl-t: #1a4550; --hl-g: #1f4a39; --hl-l: #3a4a1c; --hl-k: #3a3d3b; --shadow: 0 10px 30px rgb(0 0 0 / .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121816; --sheet: #18201d; --ink: #e4ebe7; --ink-soft: #9aa8a2;
  --rule: #2a3531; --jade: #5fc0a6; --jade-tint: #1d3029; --gold: #d2b46a; --mark: #4a4120;
  --matn: #f0a479; --matn-tint: #3d2a1f; --ul-y: #e0b44a; --ul-g: #5fc596; --ul-p: #f07a6a; --hl-y: #5a4b1c; --hl-o: #5c3a1a; --hl-r: #5e2320; --hl-p: #5a2a37; --hl-u: #3e2d57; --hl-b: #1e3a57; --hl-t: #1a4550; --hl-g: #1f4a39; --hl-l: #3a4a1c; --hl-k: #3a3d3b; --shadow: 0 10px 30px rgb(0 0 0 / .5);
  color-scheme: dark;
}
:root[data-theme="sepia"] {
  --paper: #f3ead5; --sheet: #fbf5e6; --ink: #3a2e20; --ink-soft: #6e5f4b; --rule: #e2d4b5; --gold: #86651c; --mark: #f5e2a8;
  --shadow: 0 10px 30px rgb(60 40 10 / .18);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 72px); }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 16px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--jade); outline-offset: 2px; border-radius: 4px; }

/* Top bar */
.bar { position: sticky; isolation: isolate; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--sheet); border-bottom: 1px solid var(--rule);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; }
.bar-in { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand .ar { font-family: var(--font-ar); font-size: 26px; color: var(--jade); line-height: 1; }
.brand .lat { font-family: var(--font-ui); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); white-space: nowrap; }
.search { flex: 1; min-width: 0; display: flex; }
.search input { width: 100%; min-width: 0; border: 1px solid var(--rule); background: var(--paper); border-radius: 999px; padding: 8px 14px; font-family: var(--font-ui); font-size: 14px; }
.icon-btn { flex: none; border: 1px solid var(--rule); background: var(--sheet); border-radius: 999px; height: 36px; padding: 0 12px; font-family: var(--font-ui); font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.icon-btn[aria-pressed="true"] { background: var(--jade-tint); border-color: var(--jade); color: var(--jade); }
.only-narrow { display: none; }
.brand { flex: 1; }
.tools { display: flex; gap: 2px; flex: none; }
.tb { position: relative; width: 40px; height: 40px; display: inline-grid; place-items: center; border: 0; background: transparent; border-radius: 10px; color: var(--ink); padding: 0; }
.tb:hover { background: var(--jade-tint); }
.tb[aria-pressed="true"], .tb[aria-expanded="true"] { background: var(--jade-tint); color: var(--jade); }
.tb.sm { width: 36px; height: 36px; font-size: 20px; color: var(--ink-soft); }
.badge { position: absolute; top: 3px; right: 2px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--jade); color: var(--sheet); font: 600 10px/16px var(--font-ui); }
.searchrow { max-width: 1120px; margin: 8px auto 0; display: flex; gap: 6px; align-items: center; }
.panel { position: absolute; top: calc(100% + 6px); right: max(12px, calc((100vw - 1120px) / 2)); width: min(360px, calc(100vw - 24px)); max-height: min(70vh, 560px); overflow: auto;
  background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; box-shadow: var(--shadow); padding: 14px; font-family: var(--font-ui); font-size: 14px; display: grid; gap: 12px; }
.prow { display: grid; gap: 6px; }
.plbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); font-weight: 600; }
.panel .grp { display: flex; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
.panel .grp button { flex: 1; border: 0; background: transparent; padding: 8px 10px; font-size: 13.5px; }
.panel .grp button + button { border-left: 1px solid var(--rule); }
.panel .grp button[aria-pressed="true"] { background: var(--jade-tint); color: var(--jade); font-weight: 600; }
.plist { display: grid; border-top: 1px solid var(--rule); }
.sw { display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 0; border-bottom: 1px solid var(--rule); background: transparent; padding: 11px 2px; text-align: left; font-size: 14px; }
.sw i { flex: none; width: 36px; height: 20px; border-radius: 10px; background: var(--rule); position: relative; transition: background .15s; }
.sw i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--sheet); box-shadow: 0 1px 2px rgb(0 0 0 / .25); transition: left .15s; }
.sw[aria-pressed="true"] i { background: var(--jade); }
.sw[aria-pressed="true"] i::after { left: 18px; }
.nlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.nlist button { width: 100%; text-align: left; border: 0; background: transparent; border-radius: 8px; padding: 8px; display: grid; gap: 2px; }
.nlist button:hover { background: var(--jade-tint); }
.nlist .meta { font-size: 11.5px; color: var(--ink-soft); }
.nlist .qt { font-family: var(--font-body); font-size: 15px; }
.nlist .qt[lang="ar"] { font-family: var(--font-ar); font-size: 18px; }
.nlist .tx { font-size: 13px; color: var(--ink-soft); white-space: pre-line; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.chip { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.addn { border: 1px dashed var(--jade); color: var(--jade); background: transparent; border-radius: 10px; padding: 9px 12px; font-weight: 500; }
.selbar .tool[aria-pressed="true"] { outline: 2px solid var(--paper); outline-offset: 2px; }
body.noindex .wrap { grid-template-columns: minmax(0, 1fr); max-width: 820px; }
body.noindex .wrap > .index { display: none; }
body.selon #main { padding-bottom: 160px; }
body.selon .toast { bottom: calc(130px + env(safe-area-inset-bottom, 0px)); }
.brand .ar { white-space: nowrap; }
.search input::-webkit-search-cancel-button { display: none; }
@media (max-width: 420px) { .brand .ar { font-size: 22px; } .tb { width: 38px; } }


/* Page */
.wrap { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 80px; }
.index{ position: sticky; top: calc(env(safe-area-inset-top, 0px) + 80px); align-self: start; max-height: calc(100vh - 140px); overflow: auto; font-family: var(--font-ui); }
.index h2, .sheet h2{ font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); margin: 0 0 10px; font-weight: 600; }
.index ol, .sheet ol{ list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.index a, .sheet a{ display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; padding: 8px 10px; border-radius: 8px; text-decoration: none; color: var(--ink); font-size: 14px; }
.index a:hover, .sheet a:hover{ background: var(--jade-tint); }
.index a.on, .sheet a.on{ background: var(--jade-tint); color: var(--jade); font-weight: 600; }
.sheet { font-family: var(--font-ui); }
.index .n, .sheet .n{ color: var(--gold); font-variant-numeric: tabular-nums; }
.index .c, .sheet .c{ color: var(--ink-soft); font-size: 12px; font-variant-numeric: tabular-nums; }
.index .todo, .sheet .todo{ margin-top: 14px; padding: 12px; border: 1px dashed var(--rule); border-radius: 8px; font-size: 12.5px; color: var(--ink-soft); line-height: 1.5; }

main { min-width: 0; }
.notice { font-family: var(--font-ui); font-size: 13.5px; line-height: 1.55; color: var(--ink-soft); background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; margin-bottom: 28px; max-width: 70ch; }
.notice strong { color: var(--ink); }

.bab { margin-bottom: 44px; }
.bab-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; border-bottom: 2px solid var(--jade); padding-bottom: 10px; margin-bottom: 8px; }
.bab-head .num { font-family: var(--font-ui); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
.bab-head h2 { margin: 0; font-size: calc(26px * var(--scale)); font-weight: 700; text-wrap: balance; }
.bab-head .range { margin-left: auto; font-family: var(--font-ui); font-size: 12.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

.hadith { padding-block: 26px; border-bottom: 1px solid var(--rule); }
.hadith:target .h-no { background: var(--gold); color: var(--sheet); }
.h-top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-family: var(--font-ui); }
.h-no { display: inline-grid; place-items: center; min-width: 38px; height: 38px; padding: 0 8px; border: 1.5px solid var(--gold); color: var(--gold); border-radius: 50%; font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }
.h-src { font-size: 13px; color: var(--jade); font-weight: 500; }
.h-tag { font-size: 11.5px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--rule); color: var(--ink-soft); }
.h-tag.on { border-color: var(--jade); color: var(--jade); }
.h-act { margin-left: auto; display: flex; gap: 6px; }
.h-act button { border: 1px solid var(--rule); background: transparent; border-radius: 999px; padding: 5px 11px; font-size: 12.5px; color: var(--ink-soft); }
.h-act button[aria-pressed="true"] { color: var(--gold); border-color: var(--gold); }

.ar-text { font-family: var(--font-ar); direction: rtl; text-align: right; font-size: calc(24px * var(--scale)); line-height: 2.35; margin: 0 0 18px; color: var(--ink); white-space: pre-line; }
.ms-text { font-size: calc(17.5px * var(--scale)); line-height: 1.75; margin: 0; max-width: 68ch; }
.ms-text p { margin: 0 0 .9em; }
.ms-text p:last-child { margin-bottom: 0; }
.ms-text .arq { font-family: var(--font-ar); font-size: 1.2em; color: var(--jade); }
.takhrij { margin-top: 14px; font-family: var(--font-ui); font-size: calc(13.5px * var(--scale)); color: var(--ink-soft); }
.takhrij b { color: var(--jade); font-weight: 600; }

.extra { margin-top: 14px; display: grid; gap: 10px; max-width: 68ch; }
.box { border-radius: 10px; padding: 12px 14px; font-family: var(--font-ui); font-size: calc(13.5px * var(--scale)); line-height: 1.6; }
.box h3 { margin: 0 0 6px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; }
.box.quran { background: var(--jade-tint); }
.box.quran h3 { color: var(--jade); }
.box.quran .ref { font-weight: 600; color: var(--jade); }
.box.quran .src { margin-top: 8px; font-size: 12px; color: var(--ink-soft); }
.box.note { border: 1px solid var(--rule); background: var(--sheet); }
.box.note h3 { color: var(--ink-soft); }
.box.tn { border: 1px dashed var(--gold); }
.box.tn h3 { color: var(--gold); }
.box p { margin: 0; }
.box ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }

mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
.hide-ar .ar-text { display: none; }
.hide-ms .ms-text { display: none; }
.bab-ayat { display: grid; gap: 0; }
.ayat-item { padding-block: 22px; border-bottom: 1px solid var(--rule); }
.ayat-lead { font-family: var(--font-ui); font-size: 13px; color: var(--ink-soft); margin-bottom: 10px; }
.ayat-lead .ref { color: var(--jade); font-weight: 600; }
.ayat-ar { color: var(--jade); }
.ayat-tr { font-family: var(--font-ui); font-size: calc(14px * var(--scale)); line-height: 1.6; color: var(--ink-soft); margin: 0; max-width: 68ch; }
.bab-ayat .box.quran { margin-top: 14px; }
.ms-text a { color: var(--jade); }
.bab-nota { font-family: var(--font-ui); font-size: 14px; color: var(--ink-soft); line-height: 1.6; padding-block: 14px 0; margin: 0; max-width: 68ch; }
.empty { font-family: var(--font-ui); color: var(--ink-soft); padding: 40px 0; text-align: center; }

.sheet-bg { position: fixed; inset: 0; background: rgb(0 0 0 / .35); z-index: 20; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--sheet); border-radius: 16px 16px 0 0; max-height: 75vh; overflow: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px calc(18px + env(safe-area-inset-bottom, 0px)); }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); font-family: var(--font-ui); font-size: 13px; padding: 9px 16px; border-radius: 999px; z-index: 30; }

/* Teacher annotations */
/* Prophetic words (qawl) and actions (fi'l) */
.nb-q { color: var(--matn); font-weight: 700; }
.nb-f { background: var(--matn-tint); border-radius: 3px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 13px; }
.legend .nb-q, .legend .nb-f { padding: 0 4px; }
.ann { border-radius: 3px; padding: 0 1px; cursor: pointer; color: inherit; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.ann::after { content: attr(data-n); font-family: var(--font-ui); font-size: .58em; font-weight: 600; vertical-align: super; line-height: 0; margin-inline-start: 2px; color: var(--gold); }
.ann.t-serlah.c-y { background: var(--hl-y); } .ann.t-serlah.c-o { background: var(--hl-o); } .ann.t-serlah.c-r { background: var(--hl-r); } .ann.t-serlah.c-p { background: var(--hl-p); } .ann.t-serlah.c-u { background: var(--hl-u); } .ann.t-serlah.c-b { background: var(--hl-b); } .ann.t-serlah.c-t { background: var(--hl-t); } .ann.t-serlah.c-g { background: var(--hl-g); } .ann.t-serlah.c-l { background: var(--hl-l); } .ann.t-serlah.c-k { background: var(--hl-k); }
.ann.t-nombor { background: transparent; border-radius: 0; border-bottom: 1.5px dashed var(--jade); }
.ann.t-nombor::before { content: attr(data-num); display: inline-block; min-width: 1.45em; height: 1.45em; padding: 0 .3em; border-radius: .75em; background: var(--jade); color: var(--sheet);
  font: 600 .62em/1.45em var(--font-ui); text-align: center; vertical-align: .3em; margin-inline-end: .3em; }
.ann.t-nombor::after { content: none; }
body.no-ann .ann::before { display: none; }
.ann.t-garis { background: transparent; border-radius: 0; text-decoration: underline 2.5px var(--ul-p); text-underline-offset: 4px; text-decoration-skip-ink: none; }
.ann.t-garis.c-y { text-decoration-color: var(--ul-y); } .ann.t-garis.c-g { text-decoration-color: var(--ul-g); }
.ar-text .ann.t-garis { text-underline-offset: 7px; }
.ann.bare::after { content: none; }
.ann.t-nota { background: transparent; border-bottom: 2px dotted var(--gold); border-radius: 0; }
.ann.t-pindaan { background: transparent; text-decoration: underline wavy var(--jade); text-decoration-thickness: 1.5px; text-underline-offset: 5px; }
.ann.t-pindaan.alt-on { background: var(--jade-tint); text-decoration: none; }
.ann.flash { outline: 2px solid var(--gold); outline-offset: 2px; }
.box.guru { border: 1px solid var(--gold); background: var(--sheet); }
.box.saya { border: 1px dashed var(--jade); background: var(--sheet); }
.box.saya h3 { color: var(--jade); display: flex; align-items: center; gap: 8px; }
.box.saya .ann-n { background: var(--jade); }
.ann.s-saya::after { color: var(--jade); }
.box h3 .sub { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--ink-soft); font-size: 11.5px; }
.scope { display: flex; gap: 8px; flex-wrap: wrap; }
.scope label { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule); border-radius: 999px; padding: 6px 12px; color: var(--ink); font-size: 13.5px; cursor: pointer; }
.scope input { accent-color: var(--jade); }
.box.guru h3 { color: var(--gold); display: flex; align-items: center; gap: 8px; }
.ann-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.ann-list li { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 8px; }
.ann-n { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--gold); color: var(--sheet); font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.ann-kind { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); font-weight: 600; }
.ann-quote { color: var(--ink); }
.ann-quote[lang="ar"] { font-family: var(--font-ar); font-size: 1.25em; }
.ann-alt { color: var(--jade); font-weight: 500; }
.ann-text { white-space: pre-line; color: var(--ink); }
.ann-tools { display: flex; gap: 6px; margin-top: 4px; }
.ann-tools button, .tbtn { border: 1px solid var(--rule); background: transparent; border-radius: 999px; padding: 4px 10px; font-size: 12px; color: var(--ink-soft); font-family: var(--font-ui); }
.ann-tools button.danger { color: #b3261e; border-color: currentColor; }
.ann-missing { font-size: 12px; color: #b3261e; }
.only-teacher { display: none !important; }
body.teacher .only-teacher { display: inline-flex !important; }
.teacher-chip { border: 1px solid var(--gold); color: var(--gold); border-radius: 999px; padding: 5px 10px; font-weight: 600; }
.pop { position: absolute; z-index: 25; width: min(340px, calc(100vw - 32px)); background: var(--sheet); color: var(--ink); border: 1px solid var(--rule); border-radius: 12px; box-shadow: var(--shadow); padding: 12px 14px; font-family: var(--font-ui); font-size: 14px; line-height: 1.55; display: grid; gap: 6px; }
.pop .row { display: flex; align-items: center; gap: 8px; }

/* Render text[from,to) with three layers: personal notes (outer <mark>), Prophetic words/actions (<span>), search hits (<mark>). */
function layered(text, from, to, anns, nab, q) {

function applyView() {

  document.body.classList.toggle('hide-ms', view === 'ar');

  document.documentElement.style.setProperty('--scale', scale);
}
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => { view = b.dataset.view; store.set('rs-view', view); applyView(); }));

$('#fs-down').addEventListener('click', () => { scale = Math.max(0.8, +(scale - 0.1).toFixed(2)); store.set('rs-scale', scale); applyView(); });

function toast(msg) { const el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(el._t); el._t = setTimeout(() => el.hidden = true, 1800); }
$('#list').addEventListener('click', e => {
  const mk = e.target.closest('[data-mark]');
  if (mk) {
    const n = +mk.dataset.mark;
    marks.has(n) ? marks.delete(n) : marks.add(n);
    store.set('rs-marks', [...marks]);
    const on = marks.has(n);
    mk.setAttribute('aria-pressed', on); mk.firstChild.textContent = on ? '★' : '☆';
    toast(on ? 'Hadis ' + n + ' ditanda' : 'Tanda dibuang');
    if (onlyMarks) render();
    return;
  }
  const cp = e.target.closest('[data-copy]');
  if (cp) {
    const h = DATA.hadith.find(x => x.no === +cp.dataset.copy);
    const text = 'Riyadhus Salihin, Hadis ' + h.no + '\n\n' + h.ar + '\n\n' + h.ms + '\n\n(' + h.takhrij + ')';
    const ok = () => toast('Hadis ' + h.no + ' disalin');
    try {
      navigator.clipboard.writeText(text).then(ok, () => fallbackCopy(text, ok));
    } catch (err) { fallbackCopy(text, ok); }
  }
});
function fallbackCopy(text, ok) {
  const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); ok(); } catch (e) { toast('Tidak dapat menyalin. Pilih teks secara manual.'); }
  ta.remove();
}

  return null;
}
function numbered(id) { const a = findAnn(id); if (!a) return null; const h = HMAP.get(a.no); return (prepAnns(h).find(x => x.id === id)) || null; }
const pop = $('#pop');

/* Selection → teacher toolbar */
const selbar = $('#selbar');
let pending = null, selT;
function countIn(hay, needle) { let c = 0, i = hay.indexOf(needle); while (i >= 0) { c++; i = hay.indexOf(needle, i + needle.length); } return c; }
const HLC = [["y", "Kuning"], ["o", "Oren"], ["r", "Merah"], ["p", "Merah jambu"], ["u", "Ungu"], ["b", "Biru"], ["t", "Biru laut"], ["g", "Hijau"], ["l", "Hijau pucuk"], ["k", "Kelabu"]];
let hlLast = store.get('rs-hl', 'y'), selView = 'main';
const SVG_NUM = '<span class="numdot">1</span>';
function drawSelbar(hint) {
  if (!pending && !hint) { selbar.hidden = true; document.body.classList.remove('selon'); return; }
  const q = pending ? '“' + esc(pending.quote) + '”' : esc(hint);
  let tools = '', top = '<button type="button" class="x" data-sel="cancel" aria-label="Tutup">×</button>';
  if (pending && selView === 'warna') {
    top = '<button type="button" data-sel="back">‹ Kembali</button>';
    tools = '<span class="grp pal" role="group" aria-label="Pilih warna serlahan">' + HLC.map(([k, n]) => '<button type="button" class="tool dot" data-sel="hl" data-c="' + k + '" title="' + n + '" aria-label="' + n + '" aria-pressed="' + (k === hlLast) + '" style="background:var(--hl-' + k + ')"></button>').join('') + '</span>';
  } else if (pending) {
    tools = '<span class="grp"><button type="button" class="tool hlbtn" data-sel="warna" title="Serlah" aria-label="Serlah — pilih warna"><span class="sw-dot" style="background:var(--hl-' + hlLast + ')"></span>Serlah ▾</button>' +
      '<button type="button" class="tool ul" data-sel="garis">Garis</button>' +
      '<button type="button" class="tool" data-sel="nombor" title="Letak nombor">' + SVG_NUM + ' Nombor</button>' +
      '<button type="button" class="tool" data-sel="nota">Nota</button>' +
      (pending.field === 'ms' ? '<button type="button" class="tool" data-sel="pindaan">Pindaan</button>' : '') + '</span>';
  }
  selbar.innerHTML = '<div class="srow"><span class="q" dir="auto">' + q + '</span>' + top + '</div>' + (tools ? '<div class="trow">' + tools + '</div>' : '');
  selbar.hidden = false; document.body.classList.add('selon');
}
function hideSelbar() { pending = null; selView = 'main'; drawSelbar(); }
function readSelection() {
  if (!$('#modalBg').hidden) return;
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount || sel.isCollapsed) { hideSelbar(); return; }
  const r = sel.getRangeAt(0);
  const node = r.commonAncestorContainer.nodeType === 1 ? r.commonAncestorContainer : r.commonAncestorContainer.parentElement;
  const box = node && node.closest('.ms-text, .ar-text');
  const art = box && box.closest('.hadith');
  if (!art) { hideSelbar(); return; }
  const h = HMAP.get(+art.dataset.no);
  const field = box.classList.contains('ar-text') ? 'ar' : 'ms';
  const quote = sel.toString().replace(/[﴿﴾]/g, '').replace(/\s+/g, ' ').trim();
  pending = null; selView = 'main';
  if (!quote) { drawSelbar(); return; }
  if (field === 'ar' && !barisOn) { drawSelbar('Hidupkan baris (ikon mata) untuk menanda teks Arab.'); return; }
  if (!h[field].includes(quote)) { drawSelbar('Pilih teks dalam satu perenggan sahaja, tanpa melintasi tanda lain.'); return; }
  const pre = document.createRange(); pre.setStart(box, 0); pre.setEnd(r.startContainer, r.startOffset);
  const occ = Math.min(countIn(pre.toString().replace(/[﴿﴾]/g, ''), quote), countIn(h[field], quote) - 1);
  pending = { no: h.no, field, quote, occ: Math.max(0, occ) };
  drawSelbar();
}
function nextNum(no) {
  const nums = myNotes().filter(a => a.no === no && a.type === 'nombor').map(a => parseInt(a.num, 10)).filter(n => !isNaN(n));
  return String(nums.length ? Math.max(...nums) + 1 : 1);
}
document.addEventListener('selectionchange', () => { clearTimeout(selT); selT = setTimeout(readSelection, 250); });
selbar.addEventListener('mousedown', e => e.preventDefault());
selbar.addEventListener('click', e => {
  const b = e.target.closest('[data-sel]'); if (!b) return;
  const kind = b.dataset.sel, p = pending;
  if (kind === 'warna') { selView = 'warna'; drawSelbar(); return; }
  if (kind === 'back') { selView = 'main'; drawSelbar(); return; }
  if (kind === 'cancel' || !p) { try { window.getSelection().removeAllRanges(); } catch (err) {} hideSelbar(); return; }
  try { window.getSelection().removeAllRanges(); } catch (err) {}
  hideSelbar();
  if (kind === 'hl') { hlLast = b.dataset.c; store.set('rs-hl', hlLast); quickMark(p, 'serlah', hlLast); return; }
  if (kind === 'garis') { quickMark(p, 'garis', 'p'); return; }
  if (kind === 'nombor') { quickMark(p, 'nombor', '', nextNum(p.no)); return; }
  openEditor(Object.assign({}, p, { type: kind, color: '', alt: kind === 'pindaan' ? p.quote : '', scope: 'saya' }));
});

async function quickMark(p, type, color, num) {
  const h = HMAP.get(p.no), st = findOcc(h[p.field] || '', p.quote, p.occ || 0), en = st + p.quote.length;
  if ((h._anns || prepAnns(h)).some(x => x.field === p.field && x.pos >= 0 && st < x.pos + x.quote.length && x.pos < en)) { toast('Bahagian ini sudah ditanda. Ketik tanda itu untuk mengubahnya.'); return; }
  const id = newId(), body = { no: p.no, type, field: p.field, quote: p.quote, occ: p.occ || 0, text: '', alt: '', color: color || '', at: Date.now() };
  if (type === 'nombor') body.num = num || '1';
  try {
    const where = await savePersonal(id, body, false);
    if (where === 'local') render();
    toast(type === 'garis' ? 'Digaris.' : type === 'nombor' ? 'Nombor ' + body.num + ' ditambah. Ketik untuk menukar.' : 'Diserlah.');
  } catch (err) { writeFailed(err); }
}

function newId() { return 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function putLocal(id, body) {
  MINE_LOCAL.forEach(l => { const i = l.findIndex(x => x.id === id); if (i >= 0) l.splice(i, 1); });
  if (body) { if (!MINE_LOCAL.has(body.no)) MINE_LOCAL.set(body.no, []); MINE_LOCAL.get(body.no).push(Object.assign({ id }, body, { local: true })); }
  saveLocal();
}
async function savePersonal(id, body, wasLocal) {
  if (personalMode === 'db' && db && uid && !wasLocal) {
    try { await db.collection('data/users/' + uid).doc(id).set(body); return 'db'; }
    catch (err) { if (!(err && (err.code === 'invalid_argument' || err.code === 'not_granted'))) throw err; personalMode = 'local'; }
  }

}
modal.addEventListener('submit', async e => {
  e.preventDefault(); if (!editing || editing.importing) return;
  const fd = new FormData(modal);
  const text = String(fd.get('text') || '').trim(), alt = String(fd.get('alt') || '').trim();
  if ((editing.type === 'nota' || editing.type === 'umum') && !text) { toast('Tulis nota dahulu.'); return; }
  if (editing.type === 'pindaan' && !alt) { toast('Tulis cadangan terjemahan dahulu.'); return; }
  const scope = editing.id ? editing.scope : (canWrite ? String(fd.get('scope') || 'guru') : 'saya');
  const mk = editing.type === 'serlah' || editing.type === 'garis';
  const type = mk ? String(fd.get('style') || editing.type) : editing.type;
  const num = String(fd.get('num') || '').trim().slice(0, 6);
  if (type === 'nombor' && !num) { toast('Tulis nombor dahulu.'); return; }
  const body = { no: editing.no, type, field: editing.field || null, quote: editing.quote || '', occ: editing.occ || 0,
    text, alt: editing.type === 'pindaan' ? alt : '', color: mk ? String(fd.get('color') || 'y') : '', at: editing.at || Date.now() };
  if (type === 'nombor') body.num = num;
  const btn = modal.querySelector('[type=submit]'); btn.disabled = true;
  try {
    if (scope === 'guru') {
      if (!db || !canWrite) throw { code: 'not_granted' };
      if (editing.id) await db.doc('anotasi/' + editing.id).set(body); else await db.collection('anotasi').add(body);
      closeModal(); toast('Disimpan. Semua pelajar akan melihatnya.');
    } else {
      const where = await savePersonal(editing.id || newId(), body, !!editing.local);
      closeModal(); render(); toast(where === 'db' ? 'Disimpan dalam nota anda.' : 'Disimpan dalam peranti ini.');
    }
  } catch (err) { btn.disabled = false; writeFailed(err); }
});
async function doDelete() {
  const a = editing; if (!a || !a.id) return;
  try {
    if (a.scope === 'guru') { if (!db) return; await db.doc('anotasi/' + a.id).delete(); }
    else if (a.local) { putLocal(a.id, null); render(); }
    else { await db.collection('data/users/' + uid).doc(a.id).delete(); }
    closeModal(); toast('Dipadam.');
  } catch (err) { writeFailed(err); }
}
function writeFailed(err) {
  const code = err && err.code;
  if (code === 'invalid_argument' || code === 'not_granted') { canWrite = false; document.body.classList.remove('teacher'); closeModal(); toast('Nota tidak dapat disimpan dalam akaun ini. Cuba muat semula halaman.'); render(); }
  else if (code === 'quota_exceeded') toast('Ruang simpanan nota sudah penuh. Padam beberapa nota lama.');

}

function myNotes() {

  return out.sort((a, b) => a.no - b.no || (a.field === b.field ? 0 : a.field === 'ar' ? -1 : 1) || a.pos - b.pos);
}

/* Notes backup */
function exportNotes() {
  const notes = myNotes().map(a => ({ id: a.id, no: a.no, type: a.type, field: a.field || null, quote: a.quote || '', occ: a.occ || 0, text: a.text || '', alt: a.alt || '', color: a.color || '', num: a.num || '', at: a.at || 0 }));
  if (!notes.length) { toast('Belum ada nota untuk dieksport.'); return; }
  const json = JSON.stringify({ app: 'riyadus-salihin-melayu', jenis: 'nota', dieksport: new Date().toISOString(), nota: notes });
  const name = 'nota-riyadhus-salihin-' + new Date().toISOString().slice(0, 10) + '.json';
  if (window.RSApp && RSApp.shareFile) { RSApp.shareFile(name, json); return; }
  if (window.claude && window.claude.use) {
    window.claude.use('downloads').then(dl => {
      if (!dl) return blobSave(name, json, notes.length);
      dl.save({ filename: name, data: json }).then(() => toast(notes.length + ' nota dieksport.'), err => { if (err && err.code !== 'declined') toast('Tidak dapat menyimpan fail di sini.'); });
    }, () => blobSave(name, json, notes.length));
    return;
  }
  blobSave(name, json, notes.length);
}
function blobSave(name, json, count) {
  try {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' })); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast(count + ' nota dieksport.');
  } catch (err) { fallbackCopy(json, () => toast('Nota disalin ke papan klip.')); }
}

async function doImport() {

    const id = a.id && /^[\w-]{1,64}$/.test(a.id) ? a.id : newId(); if (have.has(id)) continue;
    const body = { no: a.no, type: a.type, field: a.field === 'ar' || a.field === 'ms' ? a.field : null, quote: String(a.quote || ''), occ: +a.occ || 0, text: String(a.text || ''), alt: String(a.alt || ''), color: String(a.color || ''), at: +a.at || Date.now() };
    if (a.type === 'nombor') body.num = String(a.num || '1').slice(0, 6);

/* Connect to shared storage */
(async () => {
  if (!window.claude || !window.claude.use) return;

  if (!db) return;
  canWrite = false; // personal notes only
  uid = u ? await u.id() : null;
